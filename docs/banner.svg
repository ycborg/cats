<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!--
    Banner do CATS (README, LinkedIn e prévia do repositório).
    Fonte editável; a versão usada é docs/banner.png (gerada a partir deste arquivo em 2x).
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:ital,wght@1,800&amp;display=swap');
      .inter { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-style: italic; font-weight: 800; }
    </style>
    <clipPath id="yarn-clip">
      <circle cx="12" cy="14" r="10" />
    </clipPath>
    <clipPath id="yarn-clip-resting">
      <circle cx="13" cy="21" r="10.5" />
    </clipPath>
    <!-- Uma garra: lasca fina e afilada. -->
    <path id="claw" d="M0 0 Q7.5 19 10 44 Q4.5 22 0 0 Z" />
    <g id="scratch">
      <use href="#claw" transform="translate(0 2) scale(1 0.85)" />
      <use href="#claw" transform="translate(7.5 0)" />
      <use href="#claw" transform="translate(15 2) scale(1 0.8)" />
    </g>
    <!-- Pegada: almofada e quatro dedos (andando para cima). -->
    <g id="paw">
      <path d="M10 19c-3.3 0-6-1.9-6-4.3 0-2.3 2.6-4.7 6-4.7s6 2.4 6 4.7c0 2.4-2.7 4.3-6 4.3z" />
      <ellipse cx="3.6" cy="9.2" rx="1.9" ry="2.5" transform="rotate(-22 3.6 9.2)" />
      <ellipse cx="7.7" cy="5.2" rx="2" ry="2.6" transform="rotate(-8 7.7 5.2)" />
      <ellipse cx="12.3" cy="5.2" rx="2" ry="2.6" transform="rotate(8 12.3 5.2)" />
      <ellipse cx="16.4" cy="9.2" rx="1.9" ry="2.5" transform="rotate(22 16.4 9.2)" />
    </g>
  </defs>

  <!-- Fundo "Midnight Paper" -->
  <rect width="1280" height="640" fill="#F8FAFC" />

  <!-- Textura: garras e um caminho de patinhas, bem discretos -->
  <g fill="#0F141E" opacity="0.07">
    <use href="#scratch" transform="translate(70 70) rotate(-18) scale(1.6)" />
    <use href="#scratch" transform="translate(1150 60) rotate(22) scale(1.4)" />
    <use href="#scratch" transform="translate(60 250) rotate(14) scale(1.3)" />
    <use href="#scratch" transform="translate(1190 300) rotate(-26) scale(1.5)" />
    <use href="#paw" transform="translate(110 452) rotate(62) scale(1.1)" />
    <use href="#paw" transform="translate(140 414) rotate(55) scale(1.1)" />
    <use href="#paw" transform="translate(160 382) rotate(52) scale(1.1)" />
    <use href="#paw" transform="translate(190 350) rotate(46) scale(1.1)" />
    <use href="#paw" transform="translate(206 316) rotate(42) scale(1.1)" />
  </g>

  <!-- Logo CATS (traços do wordmark oficial, ampliados) -->
  <g transform="translate(292 112) scale(4.6)" stroke="#0F141E" stroke-linecap="round">
    <path d="M22 9C20.5 7 17.5 6 14 6C8.5 6 4 10.5 4 16C4 21.5 8.5 26 14 26C17.5 26 20.5 25 22 23" stroke-width="3" />
    <path d="M31 26L37 7L40 10L43 7L49 26" stroke-width="2.8" stroke-linejoin="round" />
    <line x1="34" y1="20" x2="46" y2="20" stroke-width="2.5" stroke-linecap="butt" />
    <line x1="56" y1="6" x2="74" y2="6" stroke-width="3" />
    <line x1="65" y1="6" x2="65" y2="26" stroke-width="3" />
    <path d="M96 10C94.5 7.5 91.5 6 87.5 6C83 6 80 8.5 80 11.5C80 15 83 16 88 17C93 18 96 19.5 96 23C96 26.5 92.5 29 87.5 29C82.5 29 79 26.5 78 24" stroke-width="3" />
  </g>

  <!-- Novelo ao lado do logo -->
  <g transform="translate(800 126) scale(4.6)" stroke="#0F141E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="14" r="10" />
    <g clip-path="url(#yarn-clip)">
      <path d="M1 10.5 C8 7 16 7 23 11.5" />
      <path d="M1 16 C8 12.5 16.5 13 23 17.5" />
      <path d="M3 21.5 C9 18 16 18.5 21.5 22.5" />
      <path d="M8.5 3 C4.5 10 5 18 9.5 25" />
      <path d="M15 3 C19.5 10 19 18.5 15 25" />
    </g>
    <path d="M20.5 19.5 C25 24 29 25 32 22 C34.5 19.5 32 16.5 29.5 18 C27.5 19.5 29 23 33 24.5 C35 25.2 37 25 38.5 24" />
  </g>

  <!-- Mensagem -->
  <text x="640" y="336" text-anchor="middle" class="inter" font-size="40" font-weight="700" fill="#0F141E">
    Otimizador ético de currículos para filtros ATS
  </text>
  <text x="640" y="386" text-anchor="middle" class="inter" font-size="23" font-weight="500" fill="#64748B">
    Score composto · 15 áreas profissionais · 100% no navegador
  </text>

  <!-- Faixa inferior (como o rodapé do site) -->
  <rect y="470" width="1280" height="170" fill="#0F141E" />
  <text x="80" y="547" class="inter" font-size="27" font-weight="600" fill="#FFFFFF">ycborg.github.io/cats</text>
  <text x="80" y="585" class="inter" font-size="19" font-weight="400" fill="#94A3B8">
    Feito para quem cai em pé no mercado de trabalho.
  </text>
  <text x="1200" y="570" text-anchor="end" class="inter" font-size="19" font-weight="400" fill="#94A3B8">
    desenvolvido por <tspan class="mono" font-size="30" fill="#FFFFFF" dx="6">ycborg</tspan>
  </text>

  <!-- Novelo e gatinho deitados sobre a borda da faixa (linha de base em y=470) -->
  <g transform="translate(726 393.2) scale(2.4)" stroke="#0F141E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="21" r="10.5" />
    <g clip-path="url(#yarn-clip-resting)">
      <path d="M1.5 17.3 C8.8 13.6 17.2 13.6 24.5 18.4" />
      <path d="M1.5 23.1 C8.8 19.4 17.7 19.9 24.5 24.7" />
      <path d="M3.6 28.9 C9.9 25.2 17.2 25.7 23 29.9" />
      <path d="M9.3 9.5 C5.1 16.8 5.7 25.2 10.4 32.5" />
      <path d="M16.2 9.5 C20.9 16.8 20.4 25.7 16.2 32.5" />
    </g>
    <path d="M22 26.5 C27 31 33 31.2 40 31 C46 30.8 50 29 53 30.5 C55.5 31.6 58 31.4 62 31" />
  </g>
  <g transform="translate(888 393.2) scale(2.4)" stroke="#0F141E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 32 C9 32 6 27 7 22 C8 17 12 14 18 14 C24 14 28 18 28 23" />
    <path d="M9 18 L8 8 L15 14" />
    <path d="M21 14 L27 7 L28 19" />
    <path d="M13 23 Q15.5 25 18 23" />
    <path d="M28 23 C36 15 60 14 76 18 C88 21 94 26 94 32" />
    <path d="M18 32 C20 29 26 29 28 32" />
    <path d="M94 31 C103 31 109 27 107 20 C106 16 101 16 101 20" />
  </g>
</svg>
